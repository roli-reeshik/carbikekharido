<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="100%" height="100%">
  <defs>
    <radialGradient id="bikeUnderGlow_Ducati" cx="50%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#00f5d4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bikeBodyGrad_Ducati" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#2c2c2c"/>
      <stop offset="60%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#080808"/>
    </linearGradient>
    <filter id="bikeShadowBlur_Ducati">
      <feGaussianBlur in="SourceGraphic" stdDeviation="10"/>
    </filter>
  </defs>
  <!-- Floor Contact Shadow & Ambient Glow -->
  <ellipse cx="400" cy="305" rx="310" ry="20" fill="#000000" opacity="0.85" filter="url(#bikeShadowBlur_Ducati)"/>
  <ellipse cx="400" cy="300" rx="250" ry="16" fill="url(#bikeUnderGlow_Ducati)"/>

  <!-- Rear Swingarm & Frame -->
  <path d="M220,265 L360,240 L440,260 L400,280 Z" fill="#1c1c1c" stroke="#444444" stroke-width="2"/>
  <line x1="360" y1="240" x2="480" y2="160" stroke="#555555" stroke-width="5"/>
  <line x1="330" y1="250" x2="420" y2="200" stroke="#00f5d4" stroke-width="3"/>

  <!-- Engine Block & Exhaust Headers -->
  <rect x="350" y="220" width="90" height="60" rx="10" fill="#181818" stroke="#333333" stroke-width="2"/>
  <path d="M370,270 Q390,300 450,290 L480,285" fill="none" stroke="#d4af37" stroke-width="5" stroke-linecap="round"/>
  <!-- Titanium Akrapovic Silencer -->
  <path d="M250,255 L340,270 L345,285 L245,270 Z" fill="#2a2a2a" stroke="#00f5d4" stroke-width="2"/>

  <!-- Aggressive Aero Fairing & Fuel Tank -->
  <path d="M340,195 Q400,145 470,145 Q520,145 550,170 L600,195 Q630,225 580,250 L520,260 L480,230 L390,235 Z" fill="url(#bikeBodyGrad_Ducati)" stroke="#00f5d4" stroke-width="2.5"/>
  
  <!-- WSBK Carbon Winglets -->
  <path d="M540,210 L600,205 L590,220 L535,225 Z" fill="#111111" stroke="#00f5d4" stroke-width="1.5"/>

  <!-- Clip-on Handlebars & Windscreen -->
  <path d="M510,145 L545,120 Q565,145 560,175 Z" fill="#00f5d4" opacity="0.25" stroke="#ffffff" stroke-width="1"/>
  <circle cx="515" cy="140" r="6" fill="#00f5d4"/>

  <!-- Sharp Tail Unit / Solo Seat Cowl -->
  <path d="M250,195 L340,195 L330,215 L240,205 Z" fill="#1a1a1a" stroke="#00f5d4" stroke-width="2"/>

  <!-- Front Inverted Öhlins Forks -->
  <line x1="535" y1="150" x2="600" y2="265" stroke="#d4af37" stroke-width="7" stroke-linecap="round"/>

  <!-- Front Wheel with Dual Brembo Discs -->
  <g transform="translate(600, 265)">
    <circle cx="0" cy="0" r="44" fill="#080808" stroke="#222222" stroke-width="6"/>
    <circle cx="0" cy="0" r="32" fill="#141414" stroke="#00f5d4" stroke-width="2"/>
    <path d="M-28,-4 L28,4 M-4,-28 L4,28 M-20,20 L20,-20 M-20,-20 L20,20" stroke="#00f5d4" stroke-width="2.5" opacity="0.85"/>
    <circle cx="0" cy="0" r="8" fill="#d4af37"/>
  </g>

  <!-- Rear Wheel & Sprocket -->
  <g transform="translate(220, 265)">
    <circle cx="0" cy="0" r="46" fill="#080808" stroke="#222222" stroke-width="7"/>
    <circle cx="0" cy="0" r="34" fill="#141414" stroke="#00f5d4" stroke-width="2"/>
    <path d="M-28,-4 L28,4 M-4,-28 L4,28 M-20,20 L20,-20 M-20,-20 L20,20" stroke="#00f5d4" stroke-width="2.5" opacity="0.85"/>
    <circle cx="0" cy="0" r="10" fill="#d4af37"/>
  </g>
</svg>